services:
  backend:
    container_name: student-notes-backend
    image: student-notes-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
    networks:
      - student-notes-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--input-type=module",
          "-e",
          "const r = await fetch('http://127.0.0.1:3000/health'); if (!r.ok) process.exit(1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    container_name: student-notes-frontend
    image: student-notes-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    networks:
      - student-notes-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  student-notes-network:
    name: student-notes-network
    driver: bridge